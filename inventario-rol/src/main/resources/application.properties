# ===================================================================
# Configuracion del Servidor y Aplicación
# ===================================================================
server.port=8080
spring.application.name=inventario-rol

# ===================================================================
# Opción 1: Base de Datos PostgreSQL con Docker (Configuracion oficial)
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/inventario_db
spring.datasource.username=postgres
spring.datasource.password=postgres123
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
# Opcion 2: Base de Datos H2 en memoria (Para probar YA MISMO sin Docker)
# Si no tienes Docker abierto, comenta la Opción 1 arriba y descomenta estas 4 líneas:
# ===================================================================
 spring.datasource.url=jdbc:h2:mem:inventario_db;DB_CLOSE_DELAY=-1
 spring.datasource.driver-class-name=org.h2.Driver
 spring.datasource.username=sa
 spring.datasource.password=
 spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# ===================================================================
# Configuración Swagger / OpenAPI
# ===================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
